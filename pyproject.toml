[project]
name = "chat-ia-kali"
version = "1.1.0"
requires-python = ">=3.10"
description = "Assistente local de pentest com IA e execução Kali via Docker"

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["backend", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = [
  "E501",  # line length handled softly; legacy prompts/catalogs are long
  "B008",  # FastAPI Depends in defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]
"backend/config.py" = ["E402"]  # reexports após env vars

[tool.coverage.run]
source = ["backend"]
omit = [
  "backend/outputs/*",
  "backend/audit/*",
  "backend/logs/*",
  "backend/recon/*",
  "backend/data/*",
]

[tool.coverage.report]
fail_under = 95
show_missing = true
skip_empty = true

[tool.bandit]
exclude_dirs = ["tests", "venv", "node_modules", "e2e"]
skips = ["B101", "B404", "B603", "B607"]
