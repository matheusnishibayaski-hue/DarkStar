services:
  kali-tools:
    build: .
    container_name: kali-tools
    hostname: kali-tools
    restart: unless-stopped
    # Perfil completo — necessário para monitor mode, airmon-ng e Wi-Fi
    privileged: true
    network_mode: host
    # Perfil restrito (sem Wi-Fi): comente privileged + network_mode: host,
    # use rede bridge e remova SYS_ADMIN — ver SECURITY.md
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_ADMIN
    devices:
      - /dev/bus/usb:/dev/bus/usb
    volumes:
      - /sys/class/net:/sys/class/net:ro
      - /sys/devices:/sys/devices:ro
      - ../backend/outputs:/tools/output
