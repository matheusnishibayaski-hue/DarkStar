# Perfil B — restrito (sem Wi-Fi / sem privileged).
# Uso:
#   cd docker
#   docker compose -f docker-compose.restricted.yml up -d --build
#
# Ou via start: start.bat restricted  /  ./start.sh restricted
#
# Mantém nmap/recon/web; não habilita monitor mode USB.

services:
  kali-tools:
    build: .
    container_name: kali-tools
    hostname: kali-tools
    restart: unless-stopped
    # Processo principal não-root; NET_RAW/NET_ADMIN permitem nmap sem privileged.
    # O executor da app usa `docker exec --user root` quando a ferramenta exigir.
    user: "1000:1000"
    privileged: false
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_RAW
      - NET_ADMIN
    mem_limit: 2g
    cpus: 1.5
    pids_limit: 256
    read_only: true
    tmpfs:
      - /tmp:size=256m,mode=1777
      - /var/tmp:size=64m,mode=1777
    volumes:
      - ../backend/outputs:/tools/output
    healthcheck:
      test: ["CMD", "nmap", "--version"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
